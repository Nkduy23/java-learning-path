# =============================================
# APPLICATION CONFIG
# =============================================
spring.application.name=ecommerce-api
server.port=8080

# =============================================
# H2 IN-MEMORY DATABASE
# Dung de phat trien — khong can cai MySQL
# Truy cap H2 console tai: http://localhost:8080/h2-console
# =============================================
spring.datasource.url=jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# JPA / HIBERNATE
# ddl-auto=create-drop: tu dong tao bang khi start, xoa khi stop
# show-sql=true: in SQL ra console de debug
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT
# secret: key bi mat de ky token (doi thanh chuoi dai hon o production)
# expiration: thoi gian het han (ms) = 24 gio
# =============================================
app.jwt.secret=ecommerce-api-secret-key-must-be-at-least-256-bits-long-for-hs256
app.jwt.expiration=86400000

# =============================================
# SWAGGER UI
# Truy cap tai: http://localhost:8080/swagger-ui.html
# =============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
